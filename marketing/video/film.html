<script type="module">
import * as THREE from 'three'
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js'
import { Font } from 'three/addons/loaders/FontLoader.js'
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js'
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js'
import { createForge } from '/src/forge.js'

// ---------------- helpers ----------------
const $ = (s) => document.querySelector(s)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const p = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, k) => a + (b - a) * k
const sio = (x) => (x = clamp(x), -(Math.cos(Math.PI * x) - 1) / 2) // camera ease
const cio = (x) => (x = clamp(x), x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2)
const site = (x) => { // the site's --ease: cubic-bezier(0.7, 0, 0.2, 1)
  x = clamp(x); let a = 0, b = 1
  for (let i = 0; i < 14; i++) { const m = (a + b) / 2, u = 3 * m * (1 - m) ** 2 * 0.7 + 3 * m * m * (1 - m) * 0.2 + m ** 3; u < x ? (a = m) : (b = m) }
  const m = (a + b) / 2; return 3 * m * m * (1 - m) + m ** 3
}
const back = (x, s = 0.9) => (x = clamp(x), 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2) // weighted landing with a small overshoot
const V = (x, y, z) => new THREE.Vector3(x, y, z)
const lv = (a, b, k) => a.clone().lerp(b, k)
const fovOf = (mm) => 2 * Math.atan(12 / mm) * 180 / Math.PI // full-frame vertical fov

await Promise.all([document.fonts.load('400 120px Geist'), document.fonts.load('400 64px "Geist Mono"'), document.fonts.load('400 84px "Instrument Serif"')]) // canvas labels need the real fonts

// ---------------- engine (the site's forge) ----------------
const forge = createForge($('#c'), { manual: true })
const { scene, camera: cam, renderer, composer } = forge
renderer.setClearColor(new THREE.Color(0x050506).convertSRGBToLinear())
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap
scene.fog = new THREE.FogExp2(0x050506, 0.012)
const bokeh = new BokehPass(scene, cam, { focus: 10, aperture: 0, maxblur: 0.012 })
composer.insertPass(bokeh, 1)
const bloom = composer.passes.find((q) => q.constructor.name === 'UnrealBloomPass')
Object.assign(forge.state, { blob: 0, watch: 0, lamp: 0, chair: 0, videocam: 0, ring: 0 })
// the forge rig (molten blob) is re-parented so it can sit inside the monolith at the board's position
let rig; scene.traverse((o) => { if (o.isMesh && o.geometry.type === 'IcosahedronGeometry') rig = o.parent })
const BOARD = V(0, -1.1, -18)
const rigHolder = new THREE.Group(); rigHolder.position.set(0, 0, BOARD.z); scene.add(rigHolder); rigHolder.add(rig)

// ---------------- lights ----------------
const key = new THREE.DirectionalLight(0xfff1e2, 0); key.castShadow = true
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 }); key.shadow.bias = -0.0004
const rim = new THREE.DirectionalLight(0xffd9bf, 0)
const fill = new THREE.HemisphereLight(0xf2eee8, 0x1a0d06, 0)
const beamLight = new THREE.SpotLight(0xffffff, 0, 20, 0.35, 0.6, 1.2)
const rimSweep = new THREE.PointLight(0xfff0e0, 0, 7, 1.6)
scene.add(key, key.target, rim, rim.target, fill, beamLight, beamLight.target, rimSweep)

// ---------------- procedural brushed metal (roughness + bump) ----------------
function brushed(seed = 1) {
  const c = document.createElement('canvas'); c.width = c.height = 2048; const g = c.getContext('2d')
  g.fillStyle = '#6e6e6e'; g.fillRect(0, 0, 2048, 2048)
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647
  for (let i = 0; i < 9000; i++) { const y = rnd() * 2048, v = 90 + rnd() * 70 | 0; g.strokeStyle = `rgba(${v},${v},${v},${0.15 + rnd() * 0.3})`; g.lineWidth = 0.6 + rnd() * 1.4; g.beginPath(); g.moveTo(0, y); g.lineTo(2048, y + (rnd() - 0.5) * 6); g.stroke() }
  for (let i = 0; i < 420; i++) { const x = rnd() * 2048, y = rnd() * 2048, a = rnd() * Math.PI, l = 8 + rnd() * 90; g.strokeStyle = `rgba(200,200,200,${0.2 + rnd() * 0.4})`; g.lineWidth = 0.7; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke() } // micro scratches
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t
}
const brushTex = brushed(7)

// ---------------- materials ----------------
const heat = { uHeatX: { value: -9 }, uHeatZ: { value: 0 }, uHeatOn: { value: 0 }, uSeam: { value: 0 }, uHalf: { value: 0.5 } }
const titanium = new THREE.MeshPhysicalMaterial({ color: 0x77736e, metalness: 1, roughness: 0.34, roughnessMap: brushTex, bumpMap: brushTex, bumpScale: 0.35, anisotropy: 0.85, clearcoat: 0.25, clearcoatRoughness: 0.4 })
titanium.customProgramCacheKey = () => 'bf-titanium'
titanium.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, heat)
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vW; varying vec3 vL;')
    .replace('#include <project_vertex>', '#include <project_vertex>\nvW = (modelMatrix * vec4(transformed, 1.0)).xyz; vL = transformed;')
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vW; varying vec3 vL; uniform float uHeatX, uHeatZ, uHeatOn, uSeam, uHalf; const float uHalfH = 0.3;')
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      // heat line: a hair-thin band travelling beneath the surface, cooling behind its head
      float dz = vW.z - uHeatZ; float band = exp(-dz * dz / 0.00035);
      float behind = uHeatX - vW.x;
      float on = behind > 0.0 ? exp(-behind * 0.8) : exp(behind * 70.0);
      vec3 hot = mix(vec3(0.55, 0.05, 0.02), vec3(1.0, 0.36, 0.12), exp(-max(behind, 0.0) * 2.5));
      totalEmissiveRadiance += hot * band * on * uHeatOn * 7.0;
      // seams: heat lives only in the gaps as the layers separate
      float edge = min(vL.z + uHalf, uHalf - vL.z);
      totalEmissiveRadiance += vec3(1.0, 0.33, 0.1) * exp(-edge / 0.015) * exp(-(uHalfH - vL.y) / 0.035) * uSeam * 1.4;`)
}
const brandMat = new THREE.MeshPhysicalMaterial({ color: 0xc4c0ba, metalness: 0.55, roughness: 0.42, roughnessMap: brushTex, anisotropy: 0.8, clearcoat: 0.3 })
const acrylic = new THREE.MeshPhysicalMaterial({ color: 0x09090a, metalness: 0.2, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.12 })
const alu = new THREE.MeshStandardMaterial({ color: 0xc9c6c1, metalness: 1, roughness: 0.22, emissive: 0xe9e5de, emissiveIntensity: 0 })
const chrome = new THREE.MeshPhysicalMaterial({ color: 0x151517, metalness: 1, roughness: 0.07, clearcoat: 1, clearcoatRoughness: 0.03 })
const glassMat = () => new THREE.MeshPhysicalMaterial({ color: 0x0b0c0e, metalness: 0.1, roughness: 0.04, transparent: true, opacity: 0.42, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.6, depthWrite: false })
const edgeMat = () => new THREE.LineBasicMaterial({ color: 0xe9e5de, transparent: true, opacity: 0.35 })

// page surface: a real website texture "etched in light" by a scanning front
const pageMat = (map, u0 = 0, u1 = 1, v0 = 0, v1 = 1) => new THREE.ShaderMaterial({ // (uBright < 1 keeps white UI type from blooming)
  transparent: true, depthWrite: false,
  uniforms: { map: { value: map }, uRev: { value: 0 }, uAlpha: { value: 1 }, uBright: { value: 0.92 }, uUV: { value: new THREE.Vector4(u0, u1, v0, v1) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D map; uniform float uRev, uAlpha, uBright; uniform vec4 uUV; varying vec2 vUv;
    void main(){
      vec2 uv = vec2(mix(uUV.x, uUV.y, vUv.x), mix(uUV.z, uUV.w, vUv.y));
      vec3 c = texture2D(map, uv).rgb * uBright;
      float vis = smoothstep(uRev, uRev - 0.004, vUv.x);
      float front = exp(-abs(vUv.x - uRev) * 260.0) * step(0.001, uRev) * step(uRev, 0.999);
      vec3 col = c * vis + vec3(1.0, 0.42, 0.14) * front * 1.6;
      gl_FragColor = vec4(col, max(vis, front) * uAlpha);
    }`,
})

// ---------------- textures ----------------
const tl = new THREE.TextureLoader()
const tex = (u) => { const t = tl.load(u); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t }
const T = { hero: tex('./tex/hero.png'), chapter: tex('./tex/chapter.png'), chapter2: tex('./tex/chapter2.png'), work: tex('./tex/work.png'), contact: tex('./tex/contact.png') }
function labelTex(lines, w = 1024, h = 512) { // text drawn with the site's fonts
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d')
  for (const [text, font, color, x, y, track = 0] of lines) { g.font = font; g.fillStyle = color; g.letterSpacing = `${track}px`; g.fillText(text, x, y) }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t
}
async function browserTex(slug) { // the site's macOS-style browser frame around a real project page
  const img = new Image(); img.src = `/shots/${slug}.webp`; await img.decode()
  const c = document.createElement('canvas'); c.width = 1440; c.height = 1864; const g = c.getContext('2d')
  g.fillStyle = '#1f1d1b'; g.fillRect(0, 0, 1440, 64)
  ;['#ff5f57', '#febc2e', '#28c840'].forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.arc(34 + i * 28, 32, 9, 0, 7); g.fill() })
  g.font = '400 22px "Geist Mono"'; g.fillStyle = '#8a847b'; g.fillText(`brandforge-media.vercel.app/work/${slug}`, 140, 40)
  g.drawImage(img, 0, 64, 1440, 1800)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t
}
const makePane = (map, w, h) => { // smoked glass slab carrying a page
  const g = new THREE.Group()
  const glass = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, h + 0.12, 0.05), glassMat())
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h), pageMat(map)); face.position.z = 0.03; face.material.uniforms.uRev.value = 1
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(glass.geometry), edgeMat())
  g.add(glass, face, edges); g.userData = { face, glass, edges }; return g
}

// ================= SHOTS 1–5: slab → layers → grid → homepage → architecture =================
const W = 16, D = 9, N = 7, H = 0.6, SD = D / N
heat.uHalf.value = SD / 2
const slices = []
for (let i = 0; i < N; i++) {
  const g = new THREE.Group(), z0 = -D / 2 + (i + 0.5) * SD
  const box = new THREE.Mesh(new THREE.BoxGeometry(W, H, SD), titanium)
  box.castShadow = box.receiveShadow = true
  const uvs = box.geometry.attributes.uv
  for (let k = 0; k < uvs.count; k++) uvs.setXY(k, uvs.getX(k) * 3, uvs.getY(k) * 0.6 + i * 0.13)
  const page = new THREE.Mesh(new THREE.PlaneGeometry(W, SD), pageMat(T.hero, 0, 1, 1 - (i + 1) / N, 1 - i / N))
  page.rotation.x = -Math.PI / 2; page.position.y = 0.003; page.renderOrder = 2
  g.add(box, page); g.userData = { z0, box, page }; scene.add(g); slices.push(g)
}
heat.uHeatZ.value = -D / 2 + 4 * SD // the seam the heat line runs along
const floorMeshes = [{ tex: T.chapter, y: -0.6, z: -9 }, { tex: T.work, y: -1.2, z: -18 }].map((f) => { // the rest of the page, stepping down like floors
  const g = new THREE.Group()
  const slab = new THREE.Mesh(new THREE.BoxGeometry(W, 0.12, D), acrylic); slab.position.y = -0.06; slab.receiveShadow = true
  const page = new THREE.Mesh(new THREE.PlaneGeometry(W, D), pageMat(f.tex)); page.rotation.x = -Math.PI / 2; page.position.y = 0.003
  g.add(slab, page); g.position.set(0, f.y, f.z); g.userData = { page }; scene.add(g); return g
})
const ribs = [] // the site's 12-column grid: hairlines on the snap, aluminium ribs for "technology"
for (const [fy, fz] of [[0, 0], [-0.6, -9], [-1.2, -18]]) for (let k = 0; k <= 12; k++) {
  const r = new THREE.Mesh(new THREE.BoxGeometry(0.02, 1, D), alu); r.position.set(-W / 2 + k * W / 12, fy, fz); r.userData.base = fy; r.castShadow = true
  scene.add(r); ribs.push(r)
}
const liftCards = []

// ================= SHOT 6: the routing board (the site's enquiry flow) =================
const board = new THREE.Group(); board.position.copy(BOARD); scene.add(board)
const inputs = ['Name', 'Email', 'Budget', 'Project'], outs = [['3D web', '60 fps'], ['Shopify', '100%'], ['Automation', '14 days'], ['Social', '30 days']]
const inZ = [-3, -1, 1, 3], outZ = [-3, -1, 1, 3], GATE = V(-1.6, 0.05, 0)
const ports = inputs.map((name, i) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.55), new THREE.MeshBasicMaterial({ map: labelTex([[name.toUpperCase(), '400 64px "Geist Mono"', '#8a847b', 30, 180, 12]], 1024, 256), transparent: true, depthWrite: false }))
  m.rotation.x = -Math.PI / 2; m.position.set(-7, 0.03, inZ[i]); board.add(m)
  const dot = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.04, 32), chrome); dot.position.set(-5.7, 0.02, inZ[i]); board.add(dot)
  return m
})
const gate = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.9), glassMat()); gate.position.copy(GATE); board.add(gate)
const gateEdges = new THREE.LineSegments(new THREE.EdgesGeometry(gate.geometry), new THREE.LineBasicMaterial({ color: 0xff5a1f, transparent: true, opacity: 1 })); gateEdges.position.copy(GATE); board.add(gateEdges)
const cards = outs.map(([name, stat], j) => {
  const g = makePane(labelTex([[name, '400 120px Geist', '#e9e5de', 60, 210, -4], [stat, '400 54px "Geist Mono"', '#e8202a', 64, 380, 6]], 1024, 512), 2.6, 1.3)
  g.userData.face.material.uniforms.uBright.value = 0.35
  scene.add(g); return g
})
function rounded(pts, r) { // polyline with quadratic fillets at every corner
  const path = new THREE.CurvePath(); let prev = pts[0]
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], b = pts[i], c = pts[i + 1]
    const d1 = b.clone().sub(a), d2 = c.clone().sub(b), rr = Math.min(r, d1.length() / 2, d2.length() / 2)
    const p1 = b.clone().sub(d1.normalize().multiplyScalar(rr)), p2 = b.clone().add(d2.normalize().multiplyScalar(rr))
    path.add(new THREE.LineCurve3(prev, p1)); path.add(new THREE.QuadraticBezierCurve3(p1, b, p2)); prev = p2
  }
  path.add(new THREE.LineCurve3(prev, pts[pts.length - 1])); return path
}
const routeMat = []
const routes = [[1, 2], [0, 1], [2, 0], [3, 3]].map(([a, b]) => { // input -> gate -> service card
  // straight runs, 45° chamfers, radiused corners: traces, not tentacles
  const y = 0.03, lane = (b - 1.5) * 0.06
  const curve = rounded([V(-5.7, y, inZ[a]), V(-3.1 - Math.abs(inZ[a]) * 0.12, y, inZ[a]), V(-2.35, y, lane), V(0.1, y, lane), V(0.1 + Math.abs(outZ[b] - lane), y, outZ[b]), V(3.3, y, outZ[b])], 0.22)
  const mat = alu.clone()
  mat.userData = { uGrow: { value: 0 }, uHead: { value: -1 }, uAll: { value: 0 }, uCool: { value: 0 } }
  mat.customProgramCacheKey = () => 'bf-route'
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, mat.userData)
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vU;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvU = uv.x;')
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vU; uniform float uGrow, uHead, uAll, uCool;')
      .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (vU > uGrow) discard;')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        vec3 e = mix(vec3(1.0, 0.36, 0.12), vec3(0.23, 0.89, 1.0), uCool);
        totalEmissiveRadiance += e * (exp(-pow((vU - uHead) * 14.0, 2.0)) * 3.0 + uAll * 1.4);`)
  }
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 240, 0.02, 10), mat); board.add(m); routeMat.push(mat)
  return { curve, card: b }
})
const beads = [0, 1, 2].map(() => { const b = new THREE.Mesh(new THREE.SphereGeometry(0.075, 32, 16), new THREE.MeshStandardMaterial({ color: 0x777370, metalness: 1, roughness: 0.2, emissive: 0xff5a1f, emissiveIntensity: 0 })); board.add(b); return b })
const BEADS = [[0, 16.75], [1, 17.05], [2, 17.35]] // route index, start time (0.9 s trip, 120 ms pause at the gate)

// ================= SHOT 7: the monolith =================
const mono = new THREE.Group(); mono.position.set(0, 1.4, BOARD.z); scene.add(mono)
const MW = 3.2, MH = 5, MD = 1.4, BAR = 0.1
const bars = []
for (const [sx, sy, sz, x, y, z] of [
  [MW, BAR, BAR, 0, MH / 2, MD / 2], [MW, BAR, BAR, 0, -MH / 2, MD / 2], [MW, BAR, BAR, 0, MH / 2, -MD / 2], [MW, BAR, BAR, 0, -MH / 2, -MD / 2],
  [BAR, MH, BAR, MW / 2, 0, MD / 2], [BAR, MH, BAR, -MW / 2, 0, MD / 2], [BAR, MH, BAR, MW / 2, 0, -MD / 2], [BAR, MH, BAR, -MW / 2, 0, -MD / 2],
  [BAR, BAR, MD, MW / 2, MH / 2, 0], [BAR, BAR, MD, -MW / 2, MH / 2, 0], [BAR, BAR, MD, MW / 2, -MH / 2, 0], [BAR, BAR, MD, -MW / 2, -MH / 2, 0]]) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), chrome); b.position.set(x, y, z); b.castShadow = true; mono.add(b); bars.push(b)
}
const filaments = [0, 1, 2].map((i) => {
  const m = new THREE.Mesh(new THREE.TorusGeometry(0.95 + i * 0.12, 0.005, 8, 200), new THREE.MeshBasicMaterial({ color: 0xff5a1f, transparent: true, opacity: 0, fog: false }))
  mono.add(m); return m
})
const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 2.4, 11, 64, 1, true), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, uniforms: { uO: { value: 0 } },
  vertexShader: 'varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'uniform float uO; varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(abs(dot(vN, vV)), 2.0); float a = f * smoothstep(0.0, 0.6, vUv.y) * smoothstep(1.0, 0.75, vUv.y) * uO; gl_FragColor = vec4(vec3(1.0, 0.95, 0.9) * a * 0.18, 1.0); }',
}))
beam.position.set(0, 5.2, BOARD.z); scene.add(beam)

// ================= SHOT 8: the portfolio unfolds =================
const PROJ = ['vanta-motors', 'kairos-horology', 'aurum-estates', 'solace-resorts', 'noir-atelier', 'halcyon-clinics']
const projPanes = []

// ================= SHOT 9: the wordmark =================
const word = new THREE.Group(); word.position.set(0, 1.25, BOARD.z); scene.add(word)
const forgeMat = new THREE.MeshPhysicalMaterial({ color: 0xb3121a, metalness: 0.2, roughness: 0.34, clearcoat: 1, clearcoatRoughness: 0.08 })
const fontReady = new TTFLoader().loadAsync('./geist-600.ttf').then((json) => {
  const font = new Font(json); let x = 0; const parts = []
  ;[...'BRANDFORGE'].forEach((ch, i) => {
    const g = new TextGeometry(ch, { font, size: 0.62, depth: 0.16, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.008, bevelSegments: 4 })
    g.computeBoundingBox(); const w = g.boundingBox.max.x - g.boundingBox.min.x
    g.translate(x - g.boundingBox.min.x, 0, -0.08); x += w + 0.018
    const m = new THREE.Mesh(g, i > 4 ? forgeMat : brandMat); parts.push(m); word.add(m)
  })
  parts.forEach((m) => { m.position.x = -x / 2 })
})

// ---------------- copy (the site's line-mask reveal) ----------------
const COPY = [['#k1', 1.0, 3.55], ['#k2', 6.55, 7.85], ['#k3', 8.9, 11.6], ['#k4', 12.9, 15.6], ['#k5', 16.7, 19.5], ['#k6', 24.7, 26.75]]
function copy(t) {
  for (const [sel, a, z] of COPY) {
    const el = $(sel); el.style.visibility = t >= a - 0.05 && t < z + 0.6 ? 'visible' : 'hidden'
    el.querySelectorAll('.mask > span').forEach((s, i) => {
      const k = site(p(t, a + 0.12 + i * 0.1, a + 1.02 + i * 0.1)), o = site(p(t, z + i * 0.05, z + 0.5 + i * 0.05))
      s.style.transform = `translateY(${(1 - k) * 110 - o * 110}%)`
    })
    el.querySelector('.lab').style.opacity = site(p(t, a, a + 0.6)) * (1 - p(t, z, z + 0.35))
  }
  const e = $('#end'); e.style.visibility = t > 28 ? 'visible' : 'hidden'
  e.style.opacity = site(p(t, 28.35, 29.0)) * (1 - p(t, 29.3, 29.8))
}

// ---------------- the 3D frame at time t ----------------
const look = (pos, target, fov, up = V(0, 1, 0)) => { cam.up.copy(up); cam.position.copy(pos); cam.lookAt(target); cam.fov = fov }
let focusDist = 10, ap = 0, xOff = 0
function scene3d(t) {
  // ---------- camera ----------
  const seam = heat.uHeatZ.value
  let pos, tgt, fov = fovOf(100), up = V(0, 1, 0); ap = 0; xOff = 0
  if (t < 4) { // S1 100mm macro, locked, 2% push
    const k = p(t, 0, 4)
    pos = V(lerp(-0.08, 0.06, k), 0.26, seam + lerp(2.3, 2.25, k)); tgt = V(0, -0.02, seam - 0.55)
    focusDist = pos.distanceTo(V(0, 0, seam)); ap = 0.016
  } else if (t < 6.5) { // S2 85mm: rapid reframe, then a slow lateral dolly
    const k = sio(p(t, 4, 4.55)), d = p(t, 4.55, 6.5)
    pos = lv(V(0.06, 0.26, seam + 2.25), V(lerp(-6.4, -5.9, d), 2.6, 8.6), k); tgt = lv(V(0, -0.02, seam - 0.55), V(0.6, -0.2, 0), k); fov = lerp(fovOf(100), fovOf(85), k)
    focusDist = pos.distanceTo(V(0, 0, 0.6)); ap = lerp(0.016, 0.0015, k)
  } else if (t < 8) { // S3 rises and settles: still on the snap
    const k = sio(p(t, 6.5, 7.3))
    pos = lv(V(-5.9, 2.6, 8.6), V(0, 12.5, 11.5), k); tgt = lv(V(0.6, -0.2, 0), V(0, -0.2, 0.2), k); fov = lerp(fovOf(85), fovOf(65), k)
    focusDist = pos.distanceTo(V(0, 0, 0)); ap = lerp(0.006, 0.0015, k)
  } else if (t < 12) { // S4 65mm top-down: the homepage; 4° tilt at the end
    const k = sio(p(t, 8, 8.8)), tilt = sio(p(t, 10.2, 12)) * 0.07
    pos = lv(V(0, 12.5, 11.5), V(0, 34.7, 34.7 * tilt + 0.01), k); tgt = V(0, 0, 0); fov = fovOf(65)
    up = lv(V(0, 1, 0), V(0, 0, -1), k).normalize(); xOff = -215 * k
  } else if (t < 16) { // S5 35mm: sweep down to a glancing angle, then track laterally through the site
    const k = sio(p(t, 12, 13)), d = sio(p(t, 12.9, 16.2))
    pos = lv(V(0, 34.7, 34.7 * 0.07 + 0.01), V(-8.5, lerp(6.2, 5.2, d), lerp(7, -11, d)), k); tgt = lv(V(0, 0, 0), V(1.2, -0.9, lerp(-2, -20, d)), k); fov = lerp(fovOf(65), fovOf(35), k)
    up = lv(V(0, 0, -1), V(0, 1, 0), k).normalize(); xOff = -215 * (1 - k)
    focusDist = pos.distanceTo(V(1.2, -0.9, lerp(-2, -20, d))); ap = 0.0012 * k
  } else if (t < 20) { // S6 50mm top-down over the routing board, 8° rotation, micro-push on the pulse
    const k = sio(p(t, 15.7, 16.7)), r = sio(p(t, 16.4, 20)) * 0.14, push = sio(p(t, 17.85, 18.3)) * 0.06
    pos = lv(V(-10.5, 2.9, -12), V(0.6, 17.8 * (1 - push), BOARD.z + 0.01), k); tgt = lv(V(-0.8, -0.9, -21), V(0.6, BOARD.y, BOARD.z), k); fov = lerp(fovOf(35), fovOf(50), k)
    up = lv(V(0, 1, 0), V(Math.sin(r), 0, -Math.cos(r)), k).normalize(); xOff = -200 * k
  } else if (t < 24) { // S7 65mm: swing down into a slow 40° orbit around the monolith
    const k = sio(p(t, 19.7, 20.7)), o = sio(p(t, 20.3, 24))
    const c = V(0, 1.4, BOARD.z), ang = lerp(-0.38, 0.32, o), R = 10.5
    const orb = V(Math.sin(ang) * R, lerp(1.6, 2.4, o), BOARD.z + Math.cos(ang) * R)
    pos = lv(V(0.6, 17.8 * 0.94, BOARD.z + 0.01), orb, k); tgt = lv(V(0.6, BOARD.y, BOARD.z), c, k); fov = lerp(fovOf(50), fovOf(65), k)
    up = lv(V(Math.sin(0.14), 0, -Math.cos(0.14)), V(0, 1, 0), k).normalize(); xOff = -200 * (1 - k)
    focusDist = pos.distanceTo(c); ap = 0.0035 * k
  } else if (t < 27.45) { // S8 35mm: pull back as the portfolio unfolds
    const d = sio(p(t, 24, 27)), m = sio(p(t, 24, 25.6)), ang = 0.32, R = 10.5
    pos = lv(V(Math.sin(ang) * R, 2.4, BOARD.z + Math.cos(ang) * R), V(0, 2.4, BOARD.z + 10.5), m).add(V(0, d * 0.3, d * 0.9)); tgt = V(0, 2.2, BOARD.z - 1); fov = lerp(fovOf(65), fovOf(35), m)
    focusDist = pos.distanceTo(V(0, 1.7, BOARD.z - 2)); ap = 0.0012
  } else { // S9 85mm locked on the wordmark (the cut happens in darkness)
    pos = V(0, 1.45, BOARD.z + 16.5); tgt = V(0, 1.45, BOARD.z); fov = fovOf(85); focusDist = 16.5
  }
  look(pos, tgt, fov, up)
  cam.setViewOffset(1920, 1080, xOff, 0, 1920, 1080)
  cam.updateProjectionMatrix()

  // ---------- slab, layers, grid, homepage ----------
  heat.uHeatX.value = t < 4 ? lerp(-1.5, 1.7, p(t, 0.5, 3.9)) : 1.7 + (t - 3.9) * 8
  heat.uHeatOn.value = p(t, 0.3, 0.9) * (1 - p(t, 4.6, 5.4))
  const sep = (i) => back(p(t, 4.05 + i * 0.09, 5.5 + i * 0.09), 0.5) * (1 - back(p(t, 6.55 + i * 0.06, 7.25 + i * 0.06), 1.1))
  heat.uSeam.value = Math.sin(Math.PI * p(t, 4.0, 6.9)) + (t > 7.2 ? Math.exp(-(t - 7.2) * 9) * 0.5 : 0)
  slices.forEach((g, i) => {
    g.visible = t < 16.4
    const s = sep(i), press = back(p(t, 6.6 + i * 0.06, 7.3 + i * 0.06), 1.2)
    g.position.set(0, s * (0.35 + (i % 3) * 0.18), g.userData.z0 + (i - 3) * s * 0.34)
    g.rotation.set(s * (i - 3) * 0.035, 0, s * ((i % 2) - 0.5) * 0.02)
    const th = lerp(1, 0.12, press); g.userData.box.scale.y = th; g.userData.box.position.y = -H * th / 2
    const pm = g.userData.page.material.uniforms
    pm.uRev.value = cio(p(t, 8.25 + i * 0.12, 9.15 + i * 0.12)); pm.uAlpha.value = 1 - p(t, 15.8, 16.4); pm.uBright.value = lerp(0.92, 0.62, p(t, 12, 13))
  })
  floorMeshes.forEach((g, i) => {
    g.visible = t > 11.5 && t < 20.8
    const u = g.userData.page.material.uniforms
    u.uRev.value = cio(p(t, 12.5 + i * 0.7, 13.6 + i * 0.7)); u.uAlpha.value = 1 - p(t, 15.8, 16.5); u.uBright.value = 0.62
  })
  const ribH = lerp(0.004, 0.13, sio(p(t, 12.7, 13.7))) * (1 - sio(p(t, 15.8, 16.4)))
  ribs.forEach((r, i) => {
    r.visible = (i < 13 ? t > 7 && (t < 9.6 || t > 12.4) : t > 12.4) && t < 16.5 && ribH > 0.002
    r.scale.y = ribH; r.position.y = r.userData.base + ribH / 2
  })
  alu.emissiveIntensity = 0.16 * p(t, 7.1, 7.6) * (1 - p(t, 9.4, 10.2))
  liftCards.forEach((c, i) => {
    const k = back(p(t, 14.1 + i * 0.25, 15.3 + i * 0.25), 0.6), gone = sio(p(t, 15.7, 16.3)), { from } = c.userData
    c.visible = t > 14 && t < 16.4
    c.position.set(from.x, from.y + 0.05 + k * 1.4 + gone * 3, from.z)
    c.rotation.set(-Math.PI / 2 + k * 0.55, 0, (i ? -1 : 1) * k * 0.08)
    c.userData.face.material.uniforms.uAlpha.value = 1 - gone; c.userData.glass.material.opacity = 0.42 * (1 - gone); c.userData.edges.material.opacity = 0.35 * (1 - gone)
  })

  // ---------- routing board ----------
  const boardOn = t > 15.9 && t < 21
  board.visible = boardOn
  const bIn = sio(p(t, 16.0, 16.8)), bOut = sio(p(t, 19.7, 20.5))
  ports.forEach((m) => { m.material.opacity = bIn * (1 - bOut) })
  gate.material.opacity = 0.42 * bIn * (1 - bOut); gateEdges.material.opacity = bIn * (1 - bOut)
  const cool = p(t, 17.2, 17.5)
  gateEdges.material.color.setRGB(lerp(1, 0.23, cool), lerp(0.35, 0.89, cool), lerp(0.12, 1, cool))
  const pulse = t >= 18 ? Math.exp(-(t - 18) * 1.3) : 0
  routes.forEach((r, j) => {
    const u = routeMat[j].userData
    u.uGrow.value = sio(p(t, 16.1 + j * 0.08, 16.9 + j * 0.08)) * (1 - sio(p(t, 19.65, 20.3)))
    u.uAll.value = pulse; u.uCool.value = cool; u.uHead.value = -1
  })
  BEADS.forEach(([ri, st], bi) => {
    const b = beads[bi], s = t - st
    b.visible = boardOn && s > 0 && s < 1.15
    if (!b.visible) return
    const k = s < 0.4 ? s / 0.4 * 0.5 : s < 0.52 ? 0.5 : 0.5 + clamp((s - 0.52) / 0.38) * 0.5 // 120 ms decision at the gate
    const e = k < 0.5 ? sio(k * 2) / 2 : 0.5 + sio((k - 0.5) * 2) / 2
    b.position.copy(routes[ri].curve.getPointAt(clamp(e))).setY(0.1)
    b.material.emissive.setRGB(e > 0.5 ? 0.23 : 1, e > 0.5 ? 0.89 : 0.36, e > 0.5 ? 1 : 0.12); b.material.emissiveIntensity = 2.5
    routeMat[ri].userData.uHead.value = e; routeMat[ri].userData.uCool.value = e > 0.5 ? 1 : cool
  })
  cards.forEach((c, j) => {
    const hitAt = BEADS.find(([ri]) => routes[ri].card === j)
    const lit = Math.max(hitAt ? p(t, hitAt[1] + 0.85, hitAt[1] + 1.1) : 0, p(t, 18, 18.2))
    const fly = sio(p(t, 19.75 + j * 0.07, 20.85 + j * 0.07)) // into the monolith
    c.position.copy(lv(V(4.6, 0.06, outZ[j]).add(BOARD), V(0, 1.4 + (j - 1.5) * 1.0, BOARD.z - 0.25 + j * 0.2), fly))
    c.rotation.set(lerp(-Math.PI / 2, 0, fly), 0, 0)
    c.userData.face.material.uniforms.uBright.value = lerp(0.35, 0.95, lit) * lerp(1, 0.55, fly)
    const fade = bIn * (1 - p(t, 24.0, 24.3)), faceFade = lerp(1, 0.12, fly)
    c.userData.face.material.uniforms.uAlpha.value = fade * faceFade; c.userData.glass.material.opacity = 0.42 * fade; c.userData.edges.material.opacity = (0.2 + 0.5 * lit) * fade
    c.visible = t > 15.9 && t < 24.3
  })

  // ---------- monolith ----------
  mono.visible = t > 20 && t < 25
  const build = back(p(t, 20.2, 21.1), 0.4), unb = sio(p(t, 24.0, 24.7))
  bars.forEach((b) => b.scale.setScalar(Math.max(0.001, build * (1 - unb))))
  const coolF = p(t, 21.2, 22.4)
  filaments.forEach((f, i) => {
    f.material.opacity = 0.55 * p(t, 20.9, 21.7) * (1 - unb)
    f.material.color.setRGB(lerp(1, 0.23, coolF), lerp(0.35, 0.89, coolF), lerp(0.12, 1, coolF)).multiplyScalar(1.4)
    f.rotation.set(Math.PI / 2, 0, 0); f.position.y = (i - 1) * 0.3; f.scale.setScalar(1 + Math.sin(t * 1.2 + i) * 0.01)
  })
  beam.visible = t > 20 && t < 27.3
  beam.material.uniforms.uO.value = p(t, 20.4, 21.4) * (1 - p(t, 23.8, 24.6))
  Object.assign(forge.state, { x: 0, y: 1.4, scale: 0.42, amp: 0.18, heat: lerp(1.1, 0.55, coolF), blob: sio(p(t, 20.4, 21.3)) * (1 - p(t, 24.0, 24.6)) })
  forge.intro.value = 1
  Object.assign(forge.pointer, { x: 0, tx: 0, y: 0, ty: 0, energy: 0 })

  // ---------- portfolio unfold ----------
  projPanes.forEach((g, i) => {
    g.visible = t > 24 && t < 27.45
    if (!g.visible) return
    const k = back(p(t, 24.05 + i * 0.08, 25.35 + i * 0.08), 0.5), fold = sio(p(t, 26.8, 27.3))
    const a = lerp(-0.95, 0.95, i / 5), R = 9
    g.position.copy(lv(V(0, 1.4, BOARD.z - 0.4 + i * 0.16), V(Math.sin(a) * R, 3.0, BOARD.z - 2 - Math.cos(a) * R + R * 0.35), k))
    g.rotation.set(0, lerp(0, -a * 0.9, k) + fold * 1.35 * (i < 3 ? 1 : -1), 0)
    g.scale.setScalar(lerp(0.55, 1, k))
    const alpha = p(t, 24.0, 24.25) * (1 - fold)
    g.userData.face.material.uniforms.uAlpha.value = alpha; g.userData.face.material.uniforms.uBright.value = 0.82; g.userData.glass.material.opacity = 0.4 * alpha; g.userData.edges.material.opacity = 0.35 * alpha
  })

  // ---------- wordmark ----------
  word.visible = t > 27.3
  rimSweep.position.set(lerp(-4.5, 4.5, sio(p(t, 27.6, 28.7))), 1.9, BOARD.z - 0.9)
  rimSweep.intensity = 70 * Math.sin(Math.PI * p(t, 27.55, 28.75))

  // ---------- light plot: at 27.0 the fill goes, then the key, rim last ----------
  const out = p(t, 27.0, 27.25)
  scene.environmentIntensity = t > 27.3 ? 1.25 * p(t, 28.1, 28.9) * (1 - p(t, 29.3, 29.75)) : (t < 4 ? 0.35 : t < 8 ? 0.1 : t < 12 ? 0.5 : t < 20 ? 0.7 : 1.4) * (1 - out) + 0.001
  fill.intensity = (t > 12 ? 0.35 : 0.15) * (1 - out)
  key.intensity = t > 27.3 ? 2.2 * p(t, 28.1, 28.9) * (1 - p(t, 29.3, 29.75)) : (t < 4 ? 0.6 : t < 8 ? 0.18 : 2.2) * (1 - p(t, 27.1, 27.3))
  rim.intensity = (t < 4 ? 1.4 : t < 8 ? 0.35 : 1.6) * (1 - p(t, 27.2, 27.45))
  const tgtK = t < 12 ? V(0, 0, 0) : t < 20 ? V(0, -1, lerp(-6, -18, p(t, 12, 16))) : V(0, 1, BOARD.z)
  key.target.position.copy(tgtK); key.position.copy(tgtK).add(V(-6, 10, 6)); rim.target.position.copy(tgtK); rim.position.copy(tgtK).add(V(7, 3, -9))
  beamLight.position.set(0, 9, BOARD.z); beamLight.target.position.set(0, 0, BOARD.z); beamLight.intensity = 40 * beam.material.uniforms.uO.value
  bloom.strength = t < 4 ? 0.28 : 0.16; bloom.threshold = t > 8 && t < 12 || t > 24 ? 0.97 : 0.88
  scene.fog.density = t > 20 && t < 27 ? 0.02 : 0.01
  bokeh.uniforms.focus.value = focusDist; bokeh.uniforms.aperture.value = ap
}

// ---------------- render with a 180° shutter (5 sub-frames averaged) ----------------
const acc = $('#acc').getContext('2d')
const SHUTTER = 0.5 / 24
window.render = (t, sub = 5) => {
  for (let i = 0; i < sub; i++) {
    const ts = sub > 1 ? t + (i / (sub - 1) - 0.5) * SHUTTER : t
    scene3d(ts); forge.frame(ts)
    acc.globalAlpha = 1 / (i + 1); acc.drawImage($('#c'), 0, 0, 3840, 2160)
  }
  acc.globalAlpha = 1
  copy(t)
  $('#grain').style.transform = `translate(${(t * 37 % 1) * -200}px, ${(t * 53 % 1) * -200}px)`
}

// ---------------- async assets ----------------
const liftReady = Promise.all([['aurum-estates', V(-3.9, -1.2, -19.2)], ['noir-atelier', V(3.9, -1.2, -17.4)]].map(async ([slug, from]) => {
  const g = makePane(await browserTex(slug), 3.2, 4.14); g.userData.from = from; scene.add(g); liftCards.push(g)
}))
const projReady = (async () => { for (const s of PROJ) { const g = makePane(await browserTex(s), 3.2, 4.14); scene.add(g); projPanes.push(g) } })()
const texReady = Promise.all(Object.values(T).map((t) => new Promise((r) => { const w = () => (t.image && t.image.complete && t.image.naturalWidth ? r() : setTimeout(w, 50)); w() })))
window.ready = Promise.all([forge.loaded, fontReady, liftReady, projReady, texReady])
</script>
