<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0e0d0c;color:#e9e5de;font-family:Geist,sans-serif;position:relative}
.glow{position:absolute;right:-120px;top:-60px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ff6a4a 0%,#e8202a 22%,#5a0a0e 55%,transparent 72%);filter:blur(4px)}
.orb{position:absolute;right:80px;top:120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8f8984,#1c1a19 55%,#0e0d0c 70%);box-shadow:inset 0 -40px 80px #e8202a88,0 40px 120px #000}
.mark{position:absolute;left:72px;top:64px;font-weight:600;font-size:26px;letter-spacing:.06em}
.mark span,h1 em{color:#e8202a}
h1{position:absolute;left:72px;bottom:150px;font-weight:400;font-size:108px;line-height:.9;letter-spacing:-.055em}
h1 em{font-family:"Instrument Serif";font-style:italic;letter-spacing:-.02em}
.tags{position:absolute;left:72px;bottom:64px;font:14px "Geist Mono";letter-spacing:.08em;text-transform:uppercase;color:#8a847b}
</style></head><body>
<div class="glow"></div><div class="orb"></div>
<div class="mark">BRAND<span>FORGE</span></div>
<h1>We forge brands<br>that <em>move.</em></h1>
<div class="tags">3D Web · Shopify · Automation · Social</div>
</body></html>
