<!doctype html>
<!-- GitHub README banner + social preview (1280x640). Render: node script in README "Repo images". -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600&family=Geist+Mono&family=Instrument+Serif:ital@1&display=block" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; background: #000; overflow: hidden; }
  body { position: relative; color: #e9e5de; font-family: Geist, sans-serif; }
  .blob { position: absolute; width: 965px; left: 300px; top: 40px; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #000 50%, transparent 60%); }
  .mark { position: absolute; left: 72px; top: 64px; font: 600 22px/1 Geist; letter-spacing: 0.04em; }
  .mark b { color: #e8202a; font-weight: 600; }
  .tag { position: absolute; right: 72px; top: 68px; font: 400 13px/1 'Geist Mono'; letter-spacing: 0.08em; text-transform: uppercase; color: #8a847b; }
  .eyebrow { position: absolute; left: 72px; top: 228px; font: 400 13px/1 'Geist Mono'; letter-spacing: 0.08em; text-transform: uppercase; color: #8a847b; }
  .eyebrow span { color: #e9e5de; margin-left: 10px; }
  h1 { position: absolute; left: 66px; top: 262px; font: 300 88px/0.98 Geist; letter-spacing: -0.035em; }
  h1 em { font: italic 400 100px/0.9 'Instrument Serif'; color: #e8202a; letter-spacing: -0.01em; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; justify-content: space-between; font: 400 13px/1 'Geist Mono'; letter-spacing: 0.08em; text-transform: uppercase; color: #8a847b; border-top: 1px solid #2a2724; padding-top: 22px; }
  .foot span:first-child { color: #e9e5de; }
</style>
</head>
<body>
  <img class="blob" src="photos/forge-blob.png" alt="" />
  <div class="fade"></div>
  <div class="mark">BRAND<b>FORGE</b></div>
  <div class="tag">Media · Dehradun, India</div>
  <p class="eyebrow">(01)<span>Independent digital studio</span></p>
  <h1>We forge brands<br />that <em>move.</em></h1>
  <div class="foot"><span>brandforge-media.vercel.app</span><span>3D web · Shopify · Automation · Social</span></div>
</body>
</html>
